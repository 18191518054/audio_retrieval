<html lang="zh-CN">
<head>

  <style>

    main{width:min(1500px,96vw);margin:38px auto 80px}.hero{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}.hero h1{font-size:30px;margin:0}.hero p{color:var(--muted);margin:6px 0 0}.badge{padding:7px 12px;border:1px solid #397761;border-radius:99px;color:var(--accent);background:#11251f}

    input,select,button{font:inherit;border-radius:9px;border:1px solid var(--line);background:#0e141c;color:var(--text);padding:10px 12px}input,select{width:100%}button{cursor:pointer;background:#1c2935}button:hover{border-color:var(--accent2)}button.primary{background:var(--accent);color:#07140f;border-color:transparent;font-weight:700}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:8px}.row>*{flex:1}.stack{display:grid;gap:10px}.small{font-size:12px;color:var(--muted)}.status{margin-top:14px;padding:12px;background:#0e141c;border:1px solid transparent;border-radius:10px;max-height:240px;overflow-y:auto;overscroll-behavior:contain;word-break:break-word}.status.warning{border-color:#8a6726;background:#211b10}.status.success{border-color:#397761;background:#102019}.status.running{border-color:#365c8d;background:#101a28}.status.error{border-color:#71383d;background:#251316}.status-title{font-weight:800;font-size:14px;margin-bottom:7px}.status-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 8px;font-size:12px;color:#c5d0df}.status-grid span{padding:4px 6px;border-radius:6px;background:#ffffff08}.status-next{margin-top:9px;padding:8px 9px;border-radius:7px;background:#d99a2522;color:#ffd37a;font-weight:700;font-size:12px}.status-detail{margin-top:7px;color:var(--muted);font-size:12px;white-space:pre-wrap}.progress-head{display:flex;justify-content:space-between;margin:8px 1px 4px;font-size:11px;color:#9fb2ca}.progress-track{height:8px;border-radius:99px;background:#253246;overflow:hidden}.progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .35s ease}.progress-fill.indeterminate{width:38%;animation:progress-slide 1.2s ease-in-out infinite}@keyframes progress-slide{from{transform:translateX(-110%)}to{transform:translateX(270%)}}.path-picker{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}.path-picker button{padding-inline:11px;white-space:nowrap}
    .searchbox{display:grid;grid-template-columns:1fr auto;gap:10px}.searchbox input{font-size:17px;padding:13px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.batch-bar{display:flex;align-items:center;gap:9px;margin-top:12px;min-height:34px}.batch-bar button{padding:6px 10px;font-size:12px}.batch-bar .danger{color:var(--danger);border-color:#63353a;background:#29191d}.batch-count{font-size:12px;color:var(--muted)}.result-browser{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:14px;align-items:start;margin-top:8px}.result-browser.detail-closed{grid-template-columns:minmax(0,1fr)}.result-list-wrap{min-width:0;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#0f151e}.result-table-head,.result-item{display:grid;gap:8px;align-items:center}.effect-columns{min-width:920px;grid-template-columns:62px minmax(180px,1.4fr) minmax(100px,.75fr) minmax(120px,.9fr) minmax(120px,.9fr) minmax(110px,.8fr) 58px 52px}.music-columns{min-width:840px;grid-template-columns:62px minmax(190px,1.5fr) minmax(90px,.65fr) minmax(105px,.75fr) minmax(100px,.7fr) minmax(110px,.8fr) 58px 52px}.result-table-head{position:sticky;top:0;z-index:2;padding:8px 10px;background:#19222e;border-bottom:1px solid var(--line);color:#8fa0b5;font-size:11px;font-weight:700}.result-table-head span:first-child{text-align:center}.selection-cell{display:flex;align-items:center;justify-content:center;gap:6px}.selection-cell input{width:14px;height:14px;margin:0;accent-color:var(--accent)}.results{display:grid}.empty{text-align:center;padding:60px 10px;color:var(--muted)}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:11px;color:#bfcee1;border:1px solid #34445a;background:#172231;border-radius:99px;padding:2px 7px}.result-item{width:100%;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid #232e3d;border-radius:0;background:#111720;color:var(--text);cursor:pointer}.result-item:last-child{border-bottom:0}.result-item:hover,.result-item.active{background:#1a2939}.result-item.active{box-shadow:inset 3px 0 var(--accent2)}.result-item .score{text-align:center;font-size:12px;color:#8090a5}.result-cell{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-item .name{font-size:12px}.result-labels{font-size:11px;color:#b8c8da}.result-custom{font-size:11px;color:var(--accent)}.result-duration,.result-format{font-size:11px;color:var(--muted)}.detail-pane{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:15px;background:#101720}.detail-pane .name{font-size:17px;margin-bottom:8px}.detail-pane audio{width:100%;margin-top:12px}.detail-pane .actions{margin-top:12px}
    #effectFilters>.tree-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}#effectFilters>.tree-tabs button{width:100%;min-width:0;height:40px;padding:7px 4px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;font-size:12px}#inlineNodes .row{gap:4px;align-items:center}#inlineNodes .row>.tree-node{flex:1;height:32px;min-height:32px;padding:0 9px;align-items:center}#inlineNodes .row>.node-action{flex:0 0 32px;width:32px;height:32px;min-height:32px;padding:0;display:grid;place-items:center;border-radius:7px;font-size:13px;line-height:1}.tree-grid .assign-tag{flex:1;text-align:left}.tree-grid .enter-child{flex:0 0 66px}.inline-editor{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;margin:6px 0 10px;padding:8px;border:1px solid #36516b;border-radius:9px;background:#131d28}.inline-editor input{min-width:0;padding:8px}.inline-editor button{padding:8px 10px}.inline-editor .save{color:#07140f;background:var(--accent);border-color:transparent;font-weight:700}
    .card{border:1px solid var(--line);border-radius:12px;padding:13px;background:#111720;display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center}.score{font:700 18px ui-monospace;color:var(--accent)}.name{font-weight:650;word-break:break-all}.meta,.reason{font-size:12px;color:var(--muted)}.reason{color:#abc8f3;margin-top:4px}.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:8px;font-size:12px}.detail-grid dt{color:#718198}.detail-grid dd{margin:0;color:#c4cfdd;word-break:break-all}.detail-tag-section{margin-top:12px;padding:10px 11px;border:1px solid #263244;border-radius:10px;background:#0d141d}.detail-tag-section h3{margin:0 0 7px;font-size:12px;color:#9cafc5}.detail-tag-tree,.detail-tag-tree ul{list-style:none;margin:0;padding-left:16px}.detail-tag-tree{padding-left:0}.detail-tag-tree li{position:relative;margin:3px 0;color:#c7d3e2;font-size:12px}.detail-tag-tree li::before{content:'└';position:absolute;left:-14px;color:#53647a}.detail-tag-tree>li::before{content:''}.detail-tag-tree .leaf{color:var(--accent);font-weight:650}.detail-tag-empty{font-size:12px;color:#66768b}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.actions button{padding:7px 9px}.actions .danger{color:var(--danger);border-color:#63353a;background:#29191d}.reference{margin-top:10px;color:var(--accent2);font-size:13px}.error{color:var(--danger)}audio{width:230px;height:34px}.wave-wrap{position:relative;margin-top:9px;height:52px;border:1px solid #263244;border-radius:8px;background:#0b1017;overflow:hidden}.wave{display:block;width:100%;height:50px;cursor:pointer}.wave-label{position:absolute;inset:0;display:grid;place-items:center;color:#66768b;font-size:11px;pointer-events:none}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000a;z-index:20;display:grid;place-items:center;padding:20px}.modal-box{width:min(780px,96vw);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.modal-head,.tree-tabs,.tree-toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between}.tree-tabs{justify-content:flex-start;margin:14px 0}.tree-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.tree-node{display:flex;justify-content:space-between;text-align:left}.tree-node small{color:var(--muted)}.assigned-list{margin:10px 0;color:var(--accent);font-size:13px}.breadcrumb{color:var(--muted);margin:10px 0}.inline-tree{max-height:360px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:10px;background:#0e141c;padding:8px}.inline-tree .tree-node{width:100%;margin-bottom:6px}.inline-head{position:sticky;top:-8px;background:#0e141c;padding:5px 0 8px;z-index:1}.tree-tabs button.active{border-color:var(--accent);color:var(--accent)}.back-small{display:inline-flex;align-items:center;gap:6px;width:auto;padding:4px 9px 4px 5px;border-color:transparent;border-radius:999px;background:#182330;color:#aebdd0;font-size:11px}.back-small .back-icon{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#263648;color:var(--accent);font-size:14px;line-height:1}.back-small:hover{color:#fff;border-color:#36516b;background:#1d2c3b}.back-small:disabled{visibility:hidden}.selected-tags{display:flex;flex-wrap:wrap;gap:5px}.selected-tags button{padding:3px 7px;font-size:11px;border-color:#397761;color:var(--accent)}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px}
    @media(max-width:1050px){main{width:min(900px,94vw)}.grid{grid-template-columns:1fr}.grid>aside{position:static;max-height:none}.result-browser{grid-template-columns:1fr}.detail-pane{position:static;max-height:none}.filters{grid-template-columns:1fr 1fr}audio{width:100%}}
  </style>

<body><main>
  <div class="hero"><div><h1>BGM 本地检索实验室</h1><p>V2 检索验证版 · 源音频始终只读</p></div><span class="badge" id="summary">读取状态…</span></div>
  <div class="grid">
    <aside class="panel stack">
      <section><h2>01 · 素材扫描</h2><div class="stack"><div class="path-picker"><input id="root" placeholder="输入目录，例如 D:\BGM"><button type="button" onclick="chooseFolder()">选择文件夹</button></div><select id="scanType" required><option value="">请选择素材类型</option><option value="music">音乐</option><option value="effect">音效</option></select><button onclick="startScan()">添加目录并扫描</button></div><p class="small">每次扫描请重新输入或选择电脑文件夹；一个目录应只放一种素材。</p></section>
      <section><h2>02 · 一键建立检索库</h2><input id="indexLimit" type="number" min="1" placeholder="数量上限（留空表示全部）"><button id="indexStart" style="width:100%;margin-top:8px" onclick="startIndex()">开始 / 继续建立检索库</button><button id="indexStop" class="danger hidden" style="width:100%;margin-top:8px" onclick="stopIndex()">安全停止</button><p class="small">支持断点继续；安全停止会在当前素材或当前小批次完成后退出，已完成结果不会丢失。</p></section>
      <section><h2>运行状态</h2><div class="status" id="job">空闲</div></section>
      <section class="filter-panel stack"><h2>03 · 筛选条件</h2>
        <label>素材类型<select id="mediaType" onchange="switchFilters()"><option value="music">音乐</option><option value="effect">音效</option></select></label>
        <label>文件格式<select id="ext"><option value="">全部格式</option><option>.wav</option><option>.mp3</option><option>.flac</option><option>.m4a</option><option>.aac</option><option>.ogg</option></select></label>
        <div class="two"><label>最短时长（秒）<input id="minSec" type="number" min="0" placeholder="不限"></label><label>最长时长（秒）<input id="maxSec" type="number" min="0" placeholder="不限"></label></div>
        <div id="musicFilters" class="stack"><div class="two"><label>最低 BPM<input id="minBpm" type="number" min="0" placeholder="不限"></label><label>最高 BPM<input id="maxBpm" type="number" min="0" placeholder="不限"></label></div>
        <label>节奏（BPM）<select id="rhythm"><option value="">全部节奏</option><option value="very_slow">很慢（&lt;70）</option><option value="slow">慢速（70–89）</option><option value="medium">中速（90–119）</option><option value="fast">快速（120–149）</option><option value="very_fast">很快（≥150）</option></select></label>
        <label>乐器<select id="instrument"><option value="">全部乐器</option><option value="piano">钢琴</option><option value="acoustic_guitar">木吉他</option><option value="electric_guitar">电吉他</option><option value="guitar">吉他</option><option value="violin">小提琴</option><option value="cello">大提琴</option><option value="strings">弦乐组</option><option value="woodwind">木管</option><option value="brass">铜管</option><option value="drums">鼓组</option><option value="percussion">打击乐</option><option value="synth">合成器</option><option value="organ">风琴</option></select></label>
        <label>情绪<select id="mood"><option value="">全部情绪</option><option value="happy">欢快</option><option value="sad">悲伤</option><option value="tense">紧张</option><option value="relaxed">舒缓</option><option value="energetic">活力</option><option value="romantic">浪漫</option><option value="solemn">庄严</option><option value="dark">阴暗</option></select></label>
        <label>风格<select id="style"><option value="">全部风格</option><option value="classical">古典</option><option value="orchestral">管弦/电影配乐</option><option value="electronic">电子</option><option value="ambient">氛围</option><option value="pop">流行</option><option value="rock">摇滚</option><option value="metal">金属</option><option value="jazz">爵士</option><option value="blues">布鲁斯</option><option value="folk">民谣/民族</option><option value="country">乡村</option><option value="hiphop">嘻哈</option><option value="dance">舞曲</option><option value="latin">拉丁</option><option value="reggae">雷鬼</option></select></label></div>
        <div id="effectFilters" class="stack hidden"><div class="tree-tabs"><button data-inline-scheme="ucs" onclick="openInlineTree('ucs')">UCS</button><button data-inline-scheme="recommended" onclick="openInlineTree('recommended')">推荐标签</button><button data-inline-scheme="instrument_material" onclick="openInlineTree('instrument_material')">乐器/材质</button><button data-inline-scheme="custom" onclick="openInlineTree('custom')">自定义</button></div><div id="effectInlineTree" class="inline-tree hidden"><div class="inline-head"><div class="row"><button id="inlineBack" class="back-small" onclick="inlineBack()"><span class="back-icon">←</span><span>上一级</span></button><button id="inlineAddCustom" class="back-small hidden" onclick="beginInlineCustom()"><span class="back-icon">＋</span><span>新建</span></button></div><div id="inlineBreadcrumb" class="small"></div></div><div id="inlineCustomEditor" class="inline-editor hidden"><input id="inlineCustomName" maxlength="80" placeholder="输入标签名称" onkeydown="if(event.key==='Enter')saveInlineCustom();if(event.key==='Escape')cancelInlineCustom()"><button class="save" onclick="saveInlineCustom()">保存</button><button onclick="cancelInlineCustom()">取消</button></div><div id="inlineNodes"></div></div><div id="effectFilterLabel" class="selected-tags"><span class="small">未选择标签</span></div><button onclick="clearEffectFilter()">清除全部标签</button></div>
        <label>结果数量<select id="limit"><option>10</option><option selected>20</option><option>50</option></select></label>
      </section>
    </aside>
    <section class="panel">
      <h2>04 · 自然语言或参考歌检索</h2>
      <div class="searchbox"><input id="query" placeholder="搜索文件名、标签，或输入自然语言描述" onkeydown="if(event.key==='Enter')search()"><button class="primary" onclick="search()">搜索</button></div>
      <div class="reference" id="reference">未选择参考歌</div>
      <div class="batch-bar"><button onclick="selectAllVisible()">选择当前页</button><button onclick="clearSelection()">取消选择</button><span class="batch-count" id="batchCount">已选择 0 条</span><button class="danger hidden" id="batchDelete" onclick="batchDeleteRecords()">批量删除</button></div>
      <div class="result-browser detail-closed"><div><div class="result-list-wrap"><div class="result-table-head music-columns" id="resultTableHead"><span>选择/#</span><span>文件名</span><span>节奏</span><span>主乐器</span><span>情绪</span><span>风格</span><span>时长</span><span>格式</span></div><div class="results" id="results"><div class="empty">扫描并生成向量后，在这里验证检索效果</div></div></div><div class="pager hidden" id="pager"><button id="prevPage" onclick="search(currentPage-1)">上一页</button><span id="pageLabel">第 1 页</span><button id="nextPage" onclick="search(currentPage+1)">下一页</button></div></div><div class="detail-pane hidden" id="detailPane"></div></div>
    </section>
  </div>
</main><div id="tagModal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2 id="tagTitle">管理素材的自定义标签</h2><button onclick="closeTagTree()">完成</button></div><div id="assignedTags" class="assigned-list"></div><div class="tree-toolbar"><button id="treeBack" class="back-small" onclick="treeBack()"><span class="back-icon">←</span><span>上一级</span></button></div><div id="breadcrumb" class="breadcrumb"></div><div id="treeGrid" class="tree-grid"></div></div></div><script>
let referenceId='', waveformGeneration=0, selectedEffectTags=new Map(), currentPage=1, currentResults=new Map(), selectedResultId=null, selectedAssetIds=new Set();
let tree={scheme:'ucs',assetId:null,filterMode:false,stack:[],nodes:[]};
let inlineTree={scheme:'ucs',stack:[],nodes:[],editingId:null,editingParentId:null};
async function api(url, options){const r=await fetch(url,options),type=r.headers.get('content-type')||'',body=await r.text();let data;if(type.includes('application/json')){try{data=JSON.parse(body)}catch{throw new Error(`服务返回了无效 JSON（HTTP ${r.status}）`)}}else{if(r.status===404&&url==='/api/select-folder')throw new Error('当前后台服务尚未加载“选择文件夹”功能，请停止并重新启动本地服务');throw new Error(`服务返回了非 JSON 内容（HTTP ${r.status}），请重启本地服务`)}if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function metric(label,value){return `<span>${esc(label)}：<b>${esc(value??0)}</b></span>`}
function progressView(p,type){const cached=Number(p.cached)||0,generated=Number(p.generated)||0,rawDone=p.completed!==undefined?p.completed:(cached+generated>0?cached+generated:(p.found??0)),done=Number(rawDone)||0,total=Number(p.queued??p.total)||0;if(total>0){const percent=Math.max(0,Math.min(100,Math.round(done/total*100)));return `<div class="progress-head"><span>${done} / ${total}</span><b>${percent}%</b></div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div>`}return `<div class="progress-head"><span>${type==='scan'?`已发现 ${done} 个文件`:'正在准备当前阶段'}</span><b>处理中</b></div><div class="progress-track"><div class="progress-fill indeterminate"></div></div>`}

function closeTagTree(){document.querySelector('#tagModal').classList.add('hidden');search(currentPage)}
async function selectScheme(scheme){tree.scheme=scheme;tree.stack=[];await loadTree(null)}
async function loadTree(parentId){const grid=document.querySelector('#treeGrid');grid.innerHTML='<div class="small">正在读取标签树…</div>';try{const p=new URLSearchParams({scheme:tree.scheme});if(parentId)p.set('parent_id',parentId);const d=await api('/api/tag-tree?'+p);tree.nodes=d.nodes;const rootName=tree.scheme==='ucs'?'UCS':tree.scheme==='recommended'?'推荐标签':'自定义标签';document.querySelector('#breadcrumb').textContent=[rootName,...tree.stack.map(x=>x.label)].join(' › ');document.querySelector('#treeBack').disabled=!tree.stack.length;grid.innerHTML=d.nodes.length?d.nodes.map(n=>tree.scheme==='ucs'?(n.child_count?`<button class="tree-node" onclick="enterNode(${n.id})"><span>${esc(n.label)}</span><small>${n.child_count} ›</small></button>`:`<button class="assign-tag" onclick="assignNode(${n.id})">选择 ${esc(n.label)}${n.code?` · ${esc(n.code)}`:''}</button>`):`<div class="row"><button class="assign-tag" onclick="assignNode(${n.id})">＋ ${esc(n.label)}</button>${n.child_count?`<button class="tree-node enter-child" title="进入下一级" onclick="enterNode(${n.id})"><small>${n.child_count}</small><span>›</span></button>`:''}</div>`).join(''):'<div class="small">当前层级没有标签</div>'}catch(e){grid.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function assignNode(id){try{if(tree.scheme==='ucs'){await post('/api/ucs-tag',{asset_id:tree.assetId,node_id:id});closeTagTree()}else if(tree.scheme==='recommended'){await post('/api/recommended-tag',{asset_id:tree.assetId,node_id:id,assigned:true});await refreshAssigned()}else{await post('/api/effect-tag',{asset_id:tree.assetId,node_id:id,assigned:true});await refreshAssigned()}}catch(e){alert(e.message)}}
async function enterNode(id){const node=tree.nodes.find(n=>n.id===id);tree.stack.push({id,label:node.label});await loadTree(id)}
async function treeBack(){if(!tree.stack.length)return;tree.stack.pop();await loadTree(tree.stack.length?tree.stack[tree.stack.length-1].id:null)}
async function refreshAssigned(){const box=document.querySelector('#assignedTags');if(!tree.assetId){box.textContent='';return}const d=await api(`/api/effect-tags?asset_id=${tree.assetId}`);let nodes=d.nodes.filter(n=>n.scheme_code===tree.scheme);if(tree.scheme==='recommended')nodes=nodes.filter(n=>n.assigned_by==='user');if(tree.scheme==='ucs'){box.innerHTML=nodes.length?'当前 UCS：'+nodes.map(n=>`${esc(n.label)}${n.code?` · ${esc(n.code)}`:''}`).join(' ')+' <button onclick="clearUcsTag()">移除</button>':'当前没有 UCS 标签，请从下方选择'}else{const empty=tree.scheme==='recommended'?'该素材尚未人工确认推荐标签':'该素材尚未标记自定义标签';box.innerHTML=nodes.length?'已标记（点击可移除）：'+nodes.map(n=>`<button onclick="unassignNode(${n.id})">${esc(n.label)} ×</button>`).join(' '):empty}}
async function clearUcsTag(){if(!confirm('确定移除该素材当前的 UCS 标签？'))return;await post('/api/ucs-tag',{asset_id:tree.assetId,node_id:null});closeTagTree()}
async function unassignNode(id){if(tree.scheme==='recommended')await post('/api/recommended-tag',{asset_id:tree.assetId,node_id:id,assigned:false});else await post('/api/effect-tag',{asset_id:tree.assetId,node_id:id,assigned:false});await refreshAssigned()}
document.addEventListener('click',event=>{if(selectedResultId!==null&&!event.target.closest('[data-result-id]')&&!event.target.closest('#detailPane'))closeDetail()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&selectedResultId!==null)closeDetail()});
switchFilters();status();setInterval(status,2000);
</script></body></html>
